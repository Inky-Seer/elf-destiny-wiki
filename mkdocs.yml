site_name: Elf Destiny Wiki
site_description: >-
  Community wiki for the Elf Destiny mods for Crusader Kings III and
  Europa Universalis V — gameplay mechanics and shared lore.
site_url: https://galacticliaison.github.io/elf-destiny-wiki/
repo_url: https://github.com/GalacticLiaison/elf-destiny-wiki
repo_name: GalacticLiaison/elf-destiny-wiki

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Lore:
      - lore/index.md
      - World History: lore/world-history.md
      - The Divine Spark & Cosmology: lore/divine-spark-and-cosmology.md
      - The Portal Network: lore/portal-network.md
      - Elven Ascension: lore/elven-ascension.md
      - The Valar Pantheon: lore/valar-pantheon.md
      - The Aeluran Religion & Order: lore/aeluran-religion-and-order.md
      - Magic: lore/magic.md
      - Genetics & Heredity: lore/genetics-and-traits.md
      - Bloodlines & Dynasties: lore/bloodlines-and-dynasties.md
      - Elven Cultures: lore/elven-cultures.md
      - Nations & Factions: lore/nations-and-factions.md
      - The Expedition Storyline: lore/expedition-storyline.md
      - Dark Elves: lore/dark-elves.md
      - Races & Creatures: lore/races-and-creatures.md
      - Ancient History & Lost Civilizations: lore/ancient-history-and-lost-civilizations.md
  - CK3 Mod:
      - ck3/index.md
      - Expeditions: ck3/expeditions.md
      - Elf Races & Traits: ck3/elf-races-traits.md
      - Bloodlines: ck3/bloodlines.md
      - Government & Diarchies: ck3/government-diarchies.md
      - Cultures & Religion: ck3/cultures-religion.md
      - Decisions & Activities: ck3/decisions-activities.md
      - Schemes, Hooks & Contracts: ck3/schemes-hooks-contracts.md
      - Units & Warfare: ck3/units-warfare.md
      - Buildings: ck3/buildings.md
      - Story Events: ck3/story-events.md
  - EU5 Mod:
      - eu5/index.md
