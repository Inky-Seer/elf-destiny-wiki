{% if page.meta.comments != false %}
<h2 id="page-discussion">Suggestions &amp; Discussion</h2>
<script src="https://giscus.app/client.js"
        data-repo="GalacticLiaison/elf-destiny-wiki"
        data-repo-id="R_kgDOShPfEA"
        data-category="Wiki Suggestions"
        data-category-id="DIC_kwDOShPfEM4C9Y3q"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="preferred_color_scheme"
        data-lang="en"
        crossorigin="anonymous"
        async>
</script>
<script>
  // Keep Giscus in sync when the reader toggles Material's dark/light mode
  new MutationObserver(function() {
    var isDark = document.body.getAttribute('data-md-color-scheme') === 'slate';
    var frame = document.querySelector('iframe.giscus-frame');
    if (frame) {
      frame.contentWindow.postMessage(
        { giscus: { setConfig: { theme: isDark ? 'dark' : 'light' } } },
        'https://giscus.app'
      );
    }
  }).observe(document.body, { attributes: true, attributeFilter: ['data-md-color-scheme'] });
</script>
{% endif %}
